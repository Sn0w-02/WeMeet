<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeMeet || 설문/성향테스트</title>
    <link rel="stylesheet" href="../css/survey.css">
</head>

<body>
    <section id="survey">
        <div class="survey-main">
            <div class="title-group">
                <h2 class="title">어떤 친구와 함께하고 싶으신가요?</h2>
                <p class="title-text">우리집 새로운 가족을 위한 맞춤 짝꿍 찾기</p>
            </div>
            <form class="survey-item">
                <div class="survey-question">
                    <h3 class="question">Q. 현재 반려동물을 키우고 있나요?</h3>
                    <label>
                        <input type="radio" name="grow" value="yes">현재 키우고 있다
                    </label>
                    <label>
                        <input type="radio" name="grow" value="before">예전에 키워 봤다
                    </label>
                    <label>
                        <input type="radio" name="grow" value="no">한번도 키워본적 없다
                    </label>
                </div>
                <div class="survey-question">
                    <h3 class="question">Q. 어떤 동물을 더 선호하시나요?</h3>
                    <label>
                        <input type="radio" name="like" value="dog">강아지
                    </label>
                    <label>
                        <input type="radio" name="like" value="cat">고양이
                    </label>
                    <label>
                        <input type="radio" name="like" value="both">둘 다 좋다
                    </label>
                    <label>
                        <input type="radio" name="like" value="notyet">아직 잘 모르겠다
                    </label>
                </div>
                <div class="survey-question">
                    <h3 class="question">Q. 어떤 체형을 선호하시나요?</h3>
                    <label>
                        <input type="radio" name="type" value="small">소형
                    </label>
                    <label>
                        <input type="radio" name="type" value="Medium">중형
                    </label>
                    <label>
                        <input type="radio" name="type" value="Large">대형
                    </label>
                    <label>
                        <input type="radio" name="type" value="any">상관없다
                    </label>
                </div>
                <div class="survey-question">
                    <h3 class="question">Q. 어떤 성격을 좋아하시나요?</h3>
                    <label>
                        <input type="radio" name="nature" value="charm">애교가 많은
                    </label>
                    <label>
                        <input type="radio" name="nature" value="calm">차분한
                    </label>
                    <label>
                        <input type="radio" name="nature" value="Active">활발한
                    </label>
                    <label>
                        <input type="radio" name="nature" value="independent">독립적인
                    </label>
                    <label>
                        <input type="radio" name="nature" value="any">상관없다
                    </label>
                </div>
                <div class="survey-question">
                    <h3 class="question">Q. 선호하시는 연령을 알려주세요~</h3>
                    <label>
                        <input type="radio" name="like" value="young">1년미만
                    </label>
                    <label>
                        <input type="radio" name="like" value="adult">성견 • 성묘
                    </label>
                    <label>
                        <input type="radio" name="like" value="old">노령견 • 노령묘
                    </label>
                    <label>
                        <input type="radio" name="like" value="any">상관없다
                    </label>
                </div>
                <div class="survey-question">
                    <h3 class="question">Q. 어디에서 키울 예정인가요?</h3>
                    <label>
                        <input type="radio" name="nature" value="apt">아파트
                    </label>
                    <label>
                        <input type="radio" name="nature" value="villa">빌라
                    </label>
                    <label>
                        <input type="radio" name="nature" value="house">단독주택
                    </label>
                    <label>
                        <input type="radio" name="nature" value="officetel">오피스텔
                    </label>
                    <label>
                        <input type="radio" name="nature" value="any">기타
                    </label>
                </div>
                <div class="survey-question">
                    <h3 class="question">Q. 함께 거주하는 분이 계신가요?</h3>
                    <label>
                        <input type="radio" name="nature" value="yes">있다
                    </label>
                    <label>
                        <input type="radio" name="nature" value="no">없다
                    </label>
                </div>
                <div class="survey-question">
                    <h3 class="question">Q. 하루 평균 얼마나 집을 비우세요?</h3>
                    <label>
                        <input type="radio" name="nature" value="apt">2시간 이하
                    </label>
                    <label>
                        <input type="radio" name="nature" value="villa">2 ~ 4시간
                    </label>
                    <label>
                        <input type="radio" name="nature" value="house">4 ~ 8시간
                    </label>
                    <label>
                        <input type="radio" name="nature" value="officetel">8시간 이상
                    </label>
                </div>
                <div class="survey-question">
                    <h3 class="question">Q. 매일 얼마나 산책하실 수 있으세요? (강아지 기준)</h3>
                    <label>
                        <input type="radio" name="nature" value="apt">30분 미만
                    </label>
                    <label>
                        <input type="radio" name="nature" value="villa">30분 ~ 1시간
                    </label>
                    <label>
                        <input type="radio" name="nature" value="house">1 ~ 2시간
                    </label>
                    <label>
                        <input type="radio" name="nature" value="officetel">2시간 이상
                    </label>
                    <label>
                        <input type="radio" name="nature" value="any">해당 안됨
                    </label>
                </div>
            </form>
            <button class="finish">완료</button>
        </div>

        <div class="survey-recommend">
            <div class="title-group">
                <img src="../img/survey/pattern.svg" alt="">
                <h2 class="title">추천동물</h2>
                <p class="title-text">여러분들과 어울리는 아이들을 소개합니다</p>
            </div>
            <div class="recommend-list"></div>
            <!-- ↑ json data를 script로 구현 -->
        </div>
    </section>
</body>

</html>
