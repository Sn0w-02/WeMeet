<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeMeet || 로그인</title>
    <link rel="stylesheet" href="../css/common.css">
    <script src="../js/common.js" defer></script>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/login.js" defer></script>
    <script src="../js/mypage.js" defer></script>
</head>

<body>
    <!-- header -->
    <header class="header">
        <div class="header-inner">
            <h1 class="logo"><a href="index.html"><img src="../img/logo.png" alt="WeMeet"></a></h1>

            <nav class="gnb" aria-label="주요메뉴">
                <ul class="gnb-list">
                    <li class="gnb-item">
                        <a href="pages/facility.html" class="gnb-link">시설안내</a>
                    </li>
                    <li class="gnb-item">
                        <a href="pages/animal.html" class="gnb-link">보호중인 아이들</a>
                    </li>
                    <li class="gnb-item">
                        <a href="pages/process.html" class="gnb-link">입양안내</a>
                        <ul class="sub-menu">
                            <li><a href="pages/process.html">입양절차</a></li>
                            <li><a href="pages/review.html">입양후기</a></li>
                        </ul>
                    </li>
                    <li class="gnb-item">
                        <a href="pages/support.html" class="gnb-link">혜택 및 제휴</a>
                        <ul class="sub-menu">
                            <li><a href="pages/support.html">국가지원</a></li>
                            <li><a href="pages/benefit.html">제휴혜택</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
            <div class="header-user">
                <a href="pages/login.html" class="login-link">로그인</a>

                <a href="pages/mypage.html" class="profile-link">

                </a>

                <a href="pages/mypage.html" class="mobile-user-link" aria-label="마이페이지">
                    <img src="img/mobile-User.png" alt="">
                </a>
            </div>

            <!-- 모바일 메뉴 버튼 -->
            <button type="button" class="menu-btn" aria-label="메뉴열기" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <section id="login">
        <div class="main-logo"><img src="../img/login/WeMeet.png" alt=""></div>

        <div class="input-group">
            <input type="text" id="loginId" placeholder="아이디">
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="비밀번호">
        </div>

        <div class="login-action-row">
            <button type="button" id="loginBtn" class="btn-login">로그인</button>
            <a href="#" class="find-links">아이디 / 비밀번호 찾기</a>
        </div>

        <div class="divider">또는</div>

        <a href="#" class="btn-social btn-signup">아이디로 회원가입</a>

        <a href="#" class="btn-social btn-google">
            <div class="social-content">
                <span class="social-badge google-badge"><img src="../img/login/Rectangle 248.png" alt=""></span>
                <span>구글로 시작하기</span>
            </div>
        </a>

        <a href="#" class="btn-social btn-naver">
            <div class="social-content">
                <span class="social-badge naver-badge"><img src="../img/login/Rectangle 249.png" alt=""></span>
                <span>네이버로 시작하기</span>
            </div>
        </a>

        <a href="#" class="btn-social btn-kakao">
            <div class="social-content">
                <span class="social-badge kakao-badge"><img src="../img/login/Rectangle 250.png" alt=""></span>
                <span>카카오로 시작하기</span>
            </div>
        </a>
    </section>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <a href="./index.html" class="footer-logo">
                    <img src="../img/footer-logo.png" alt="WeMeet">
                </a>
                <p class="copyright">
                    ©2026 WeMeet. All rights reserved.
                </p>
            </div>

            <div class="footer-info">
                <div class="footer-info-group">
                    <p>상호 : 서울 동물 보호센터 위밋</p>
                    <p>사업자번호 : 123-45-56789</p>
                </div>
                <div class="footer-info-group">
                    <p>Tel : 02-1234-5678</p>
                    <p>주소 : 서울특별시 강서구 화곡로 149</p>
                </div>
            </div>

            <div class="footer-sns">
                <a href="#" aria-label="인스타그램">
                    <img src="../img/instar.png" alt="Instagram"></img>
                </a>
                <a href="#" aria-label="유튜브">
                    <img src="../img/youtube.png" alt="Youtube"></img>
                </a>
            </div>

        </div>

    </footer>

</html>
