<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeMeet || 로그인</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <section id="login">
        <div class="main-logo"><img src="img/WeMeet.png" alt=""></div>

        <div class="input-group">
            <input type="text" placeholder="아이디(입력 클릭시 입체적으로 변함)">
        </div>
        <div class="input-group">
            <input type="password" placeholder="비밀번호">
        </div>

        <div class="login-action-row">
            <button class="btn-login">로그인</button>
            <a href="#" class="find-links">아이디 / 비밀번호 찾기</a>
        </div>

        <div class="divider">또는</div>

        <a href="#" class="btn-social btn-signup">아이디로 회원가입</a>

        <a href="#" class="btn-social btn-google">
            <div class="social-content">
                <span class="social-badge google-badge"><img src="img/Rectangle 248.png" alt=""></span>
                <span>구글로 시작하기</span>
            </div>
        </a>

        <a href="#" class="btn-social btn-naver">
            <div class="social-content">
                <span class="social-badge naver-badge"><img src="img/Rectangle 249.png" alt=""></span>
                <span>네이버로 시작하기</span>
            </div>
        </a>

        <a href="#" class="btn-social btn-kakao">
            <div class="social-content">
                <span class="social-badge kakao-badge"><img src="img/Rectangle 250.png" alt=""></span>
                <span>카카오로 시작하기</span>
            </div>
        </a>
    </section>

</body>

</html>
