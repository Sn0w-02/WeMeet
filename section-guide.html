<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guide</title>
    <link rel="stylesheet" href="./css/guide.css">
</head>

<body>
    <section class="guide-card">
        <div class="guide-card-inner">

            <!-- 왼쪽 이미지 영역 -->
            <div class="guide-card-visual">
                <img src="../img/" alt="반려동물과 보호자 이미지">
            </div>

            <!-- 오른쪽 콘텐츠 영역 -->
            <div class="guide-card-content">

                <!-- 제목 -->
                <div class="guide-card-title">
                    <p>입양은 끝이 아닌 시작!</p>
                    <p><strong>WeMeet</strong> 이 함께 합니다.</p>
                </div>

                <!-- 카드 메뉴 -->
                <div class="guide-card-menu">

                    <!-- 성향 테스트 -->
                    <div class="guide-card-item">
                        <div class="guide-card-icon">
                            <img src="img/guide-test-icon.png" alt="성향 테스트 아이콘">
                        </div>

                        <div class="guide-card-text">
                            <p class="guide-card-name">성향 테스트</p>
                            <p class="guide-card-description">
                                나는 어떤 성향의 아이와 잘 맞을까?
                            </p>
                        </div>

                        <div class="guide-card-arrow">
                            <img src="img/arrow-icon.png" alt="바로가기">
                        </div>
                    </div>


                    <!-- 입양학교 -->
                    <div class="guide-card-item beige">
                        <div class="guide-card-icon">
                            <img src="img/guide-school-icon.png" alt="입양학교 아이콘">
                        </div>

                        <div class="guide-card-text">
                            <p class="guide-card-name">행복 입양하기</p>
                            <p class="guide-card-description">
                                사랑으로 아이들을 위한 입양학교
                            </p>
                        </div>

                        <div class="guide-card-arrow">
                            <img src="img/arrow-icon.png" alt="바로가기">
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </section>
</body>

</html>
