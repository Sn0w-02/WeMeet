<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeMeet</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <script src="js/script.js" defer></script>
    <script src="js/common.js" defer></script>
</head>

<body>
    <!-- header -->
    <header class="header">
        <div class="header-inner">
            <h1 class="logo"><a href="index.html"><img src="img/logo.png" alt="WeMeet"></a></h1>

            <nav class="gnb" aria-label="주요메뉴">
                <ul class="gnb-list">
                    <li class="gnb-item">
                        <a href="pages/facility.html">시설안내</a>
                    </li>
                    <li class="gnb-item">
                        <a href="pages/animal.html">보호중인 아이들</a>
                    </li>
                    <li class="gnb-item">
                        <a href="pages/process.html">입양안내</a>
                        <ul class="sub-menu">
                            <li><a href="pages/process.html">입양절차</a></li>
                            <li><a href="pages/review.html">입양후기</a></li>
                        </ul>
                    </li>
                    <li class="gnb-item">
                        <a href="pages/support.html">혜택 및 제휴</a>
                        <ul class="sub-menu">
                            <li><a href="pages/support.html">국가지원</a></li>
                            <li><a href="pages/benefit.html">제휴혜택</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
            <div class="header-user"><a href="pages/login.html" class="login-link">로그인</a></div>
        </div>
    </header>

    <!-- main -->
    <main>

    </main>

    <!-- fixed -->
    <section id="section-reservation">
        <button type="button" class="reservation-btn">예약하기</button>
    </section>

    <!-- 예약하기 모달 -->
    <div class="reservation-modal">
        <div class="reservation-modal-inner">
            <button type="button" class="reservation-close" aria-label="예약창 닫기">
                X
            </button>
            <h2>지점 방문예약</h2>
            <form id="reservation-form">
                <div class="form-group">
                    <label for="user-name">이름</label>
                    <input type="text" id="user-name" name="name" placeholder="이름을 입력해주세요">
                </div>
                <div class="form-group">
                    <label for="user-phone">연락처</label>
                    <input type="tel" id="user-phone" name="phone" placeholder="010-1234-5678">
                </div>
                <div class="form-group">
                    <label for="animal-breed">품종</label>
                    <input type="text" id="animal-breed" name="animalBreed" placeholder="품종을 입력해주세요">
                </div>
                <div class="form-group">
                    <label for="visit-data">방문일자</label>
                    <input type="date" id="visit-data" name="visitData">
                </div>
                <fieldset class="purpose-group">
                    <legend>방문목적</legend>
                    <label>
                        <input type="radio" name="purpose" value="사전만남">사전만남
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="시설방문">시설방문
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="입양신청">입양신청
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="임시보호신청">임시보호신청
                    </label>
                </fieldset>
                <!-- 미작성 경고 -->
                <p class="reservation-warning">
                    작성되지 않은 항목이 있습니다.
                    모든 항목을 작성해 주세요.
                </p>
                <button type="submit" class="reservation-submit">
                    신청하기
                </button>
            </form>
        </div>
    </div>
    <!-- 예약완료 모달 -->
    <div class="reservation-complete-modal">
        <div class="reservation-complete-inner">
            <p>
                신청해 주셔서 감사합니다
            </p>
            <button type="button" class="reservation-confirm">
                확인
            </button>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <a href="./index.html" class="footer-logo">
                    <img src="img/footer-logo.png" alt="WeMeet">
                </a>
                <p class="copyright">
                    ©2026 WeMeet. All rights reserved.
                </p>
            </div>

            <div class="footer-info">
                <div class="footer-info-group">
                    <p>상호 : 서울 동물 보호센터 위밋</p>
                    <p>사업자번호 : 123-45-56789</p>
                </div>
                <div class="footer-info-group">
                    <p>Tel : 02-1234-5678</p>
                    <p>주소 : 서울특별시 강서구 화곡로 149</p>
                </div>
            </div>

            <div class="footer-sns">
                <a href="#" aria-label="인스타그램">
                    <img src="img/instar.png" alt="Instagram"></img>
                </a>
                <a href="#" aria-label="유튜브">
                    <img src="img/youtube.png" alt="Youtube"></img>
                </a>
            </div>

        </div>

    </footer>
</body>

</html>
